name: 问题反馈
description: 报告界面、推荐或 Windows 运行问题
body:
  - type: input
    id: version
    attributes:
      label: 工具版本 / Windows 版本 / 游戏地区与版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与本局输入
      description: 包含英雄、已选强化、候选、已有装备和锁定路线；请移除个人信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
