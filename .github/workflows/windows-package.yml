name: Windows package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - shell: pwsh
        run: Get-FileHash release/*Setup.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: HexARAM-Windows-x64
          path: |
            release/*Setup.exe
            release/SHA256.txt
